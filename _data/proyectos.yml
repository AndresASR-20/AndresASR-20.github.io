- id: "entertainment_tickets_seller_analysis"
  area_es: "Análisis de Datos"
  area_en: "Data Analysis"
  titulo_es: "Optimización de gastos de distribuidora de entrada a eventos de entretenimiento"
  titulo_en: "Expense Optimization for an Entertainment Event Ticket Distributor"
  descripcion_es: "Showz es una empresa de venta de entradas de eventos. Anteriormente a la ejecución del proyecto, la empresa se encontraba en una situación de toma de decisiones en cuanto a la regulación de sus gastos de operación, buscando identificar el comportamiento y participación de sus fuentes de anuncios y dispositivos en los que se encuentra habilitada la plataforma de ventas de la empresa, con el propósito principal de que los descubrimientos generados permitan una claridad precisa para la toma de decisiones respecto a la optimización o descarte de fuentes de anuncios y dispositivos."
  descripcion_en: "Showz is a ticket sales company for events. Prior to the execution of the project, the company found itself in a decision-making situation regarding the regulation of its operating expenses, seeking to identify the behavior and share of its ad sources and devices on which the company's sales platform is enabled, with the primary purpose that the generated findings allow precise clarity for decision-making regarding the optimization or discarding of ad sources and devices."
  herramientas: "Python / Pandas / NumPy / Matplotlib / Seaborn / Pyplot / Jupyter Notebook"

- id: "patterns_and_clustering_analysis"
  area_es: "Análisis de Datos"
  area_en: "Data Analysis"
  titulo_es: "Análisis de retención de clientes para gimnasio"
  titulo_en: "Customer Retention Analysis for Gym"
  descripcion_es: "En todas las industrias, la retención de clientes es fundamental para garantizar ingresos sostenibles y reducir los costos asociados con la adquisición de nuevos clientes. LLevando esta situación de retención de clientes al sector de los servicios de gimnasio, uno de los problemas más comunes que enfrentan los gimnasios y otros servicios es la pérdida de clientes. ¿Cómo descubres si un/a cliente ya no está contigo? En el caso de un gimnasio, tiene sentido decir que un/a cliente se ha ido si no viene durante un mes. Por supuesto, es posible que se hayan ido de viaje y retomen sus visitas cuando regresen, pero ese no es un caso típico. Por lo general, si un/a cliente se une, viene varias veces y luego desaparece, es poco probable que regrese. Identificar los factores clave que influyen en la retención y cancelación permite al gimnasio Model Fitness anticiparse a los riesgos de abandono, diseñar estrategias de fidelización efectivas y personalizar las experiencias para cada cliente."
  descripcion_en: "Across all industries, customer retention is essential to ensure sustainable revenue and reduce the costs associated with acquiring new customers. Bringing this customer retention situation to the gym services sector, one of the most common problems faced by gyms and other services is customer churn. How do you find out if a customer is no longer with you? In the case of a gym, it makes sense to say that a customer has left if they do not come for a month. Of course, it is possible that they went on a trip and resume their visits when they return, but that is not a typical case. Usually, if a customer joins, comes a few times, and then disappears, they are unlikely to return. Identifying the key factors influencing retention and cancellation allows the Model Fitness gym to anticipate churn risks, design effective loyalty strategies, and personalize experiences for each customer."
  herramientas: "Python / Pandas / NumPy / Matplotlib / Seaborn / Pyplot / Scikit-learn / Jupyter Notebook"

  - id: "Video_categories_behavior_analysis_by_dashboard"
  area_es: "Dashboards"
  area_en: "Dashboards"
  titulo_es: "Análisis de tendencias de categorías consumidas en Youtube"
  titulo_en: "Trend Analysis of Consumed Categories on YouTube"
  descripcion_es: "La agencia de publicidad Sterling & Draper tiene la necesidad de analizar tendencias de vídeos en YouTube para determinar qué contenido merece atención para la mercadotecnia. Cada video tiene una categoría específica (entretenimiento, música, noticias y política, etc.), una región y una fecha en que se hace tendencia. Un video puede estar en la sección de tendencias durante varios días seguidos. Cada semana, es requerido que se genere una respuesta a las siguientes preguntas: ¿Qué categorías estaban en las tendencias de la semana pasada? ¿Cómo se distribuyeron en diversas regiones? ¿Qué categorías fueron particularmente populares en los Estados Unidos?."
  descripcion_en: "The advertising agency Sterling & Draper has the need to analyze video trends on YouTube to determine which content deserves attention for marketing. Each video has a specific category (entertainment, music, news & politics, etc.), a region, and a date when it becomes a trend. A video can be in the trending section for several consecutive days. Each week, it is required to generate a response to the following questions: What categories were in last week's trends? How were they distributed across various regions? What categories were particularly popular in the United States?"
  herramientas: "Tableau"

  - id: "ecommerce_sales_analysis_for_executives_and_commercials"
  area_es: "Dashboards"
  area_en: "Dashboards"
  titulo_es: "Dashboard para análisis ejecutivo y comercial de ventas para tienda online"
  titulo_en: "Dashboard for executive and commercial sales analysis for online store"
  descripcion_es: "Este proyecto consistió en el diseño e implementación de un dashboard interactivo en Power BI para una tienda en línea (starter) en etapa de crecimiento continuo. El objetivo principal fue centralizar y estructurar la información proveniente de dos fuentes clave de la empresa: el registro general de ventas (que detalla fechas, clientes y ubicaciones geográficas) y el desglose de cada orden (que desmenuza montos, ganancias, métodos de pago y la jerarquía de categorías y subcategorías de productos). Con esta base, se transformaron los datos crudos en un ecosistema de visualización unificado que equilibra un enfoque ejecutivo de alto nivel con un análisis comercial profundamente operativo. La solución permite al negocio supervisar continuamente su estatus de ventas mediante el seguimiento de KPIs minoristas críticos como el total de productos vendidos, el valor de venta promedio, el margen de ganancia y el promedio de artículos por transacción. Para responder a las necesidades estratégicas de la empresa, el cuadro de mando fue dotado de herramientas dinámicas que explican el comportamiento temporal y geográfico de los ingresos, la segmentación del consumo por género mediante filtros interactivos y el nivel de participación real de cada categoría en el catálogo. Como resultado, el negocio ahora cuenta con una herramienta clave para agilizar la toma de decisiones y detectar nuevas oportunidades de mercado.."
  descripcion_en: "This project consisted of the design and implementation of an interactive dashboard in Power BI for an online store (starter) in a stage of continuous growth. The main objective was to centralize and structure the information coming from two key sources of the company: the general sales record (which details dates, customers, and geographic locations) and the breakdown of each order (which breaks down amounts, profits, payment methods, and the hierarchy of product categories and subcategories). With this base, raw data were transformed into a unified visualization ecosystem that balances a high-level executive approach with a deeply operational commercial analysis. The solution allows the business to continuously monitor its sales status through the tracking of critical retail KPIs such as total products sold, average sales value, profit margin, and the average number of items per transaction. To respond to the strategic needs of the company, the dashboard was equipped with dynamic tools that explain the temporal and geographical behavior of revenues, consumption segmentation by gender through interactive filters, and the level of real participation of each category in the catalog. As a result, the business now has a key tool to streamline decision-making and detect new market opportunities.."
  herramientas: "Power BI / Power Query / DAX / Data modelling / Star Schema"

  - id: "churn_analysis_for_telecom_business"
  area_es: "Análisis de Datos"
  area_en: "Data Analysis"
  titulo_es: "Análisis de tendencias y patrones de cancelación en servicio de suscripción para empresa de telecomunicaciones"
  titulo_en: "Churn Trend and Pattern Analysis in Subscription Services for a Telecommunications Company"
  descripcion_es: "Este proyecto consistió en el análisis estratégico y la optimización del ecosistema de retención de clientes para una compañía de telecomunicaciones en expansión. El objetivo principal fue centralizar y estructurar la información masiva proveniente de su base de datos de suscriptores (que detalla perfiles demográficos, antigüedad, tipos de contrato y métodos de pago) junto con el desglose del consumo de su suite de servicios avanzados (conectividad por DSL y fibra óptica, herramientas de ciberseguridad, soporte técnico y plataformas de streaming). Con esta base de datos crudos, se implementó un proceso riguroso de limpieza y transformación en PostgreSQL, convirtiendo registros inconsistentes en un entorno analítico unificado que equilibra un diagnóstico financiero de alto nivel con un análisis del comportamiento operativo de los usuarios. La solución permite al negocio supervisar continuamente su salud comercial mediante el seguimiento de KPIs de retención críticos como la tasa de Churn global, el impacto en ingresos mensuales perdidos, el valor de vida acumulado (Customer Lifetime Value) y la densidad de adopción de servicios por usuario. Para responder a las necesidades estratégicas de la empresa, el análisis fue estructurado para identificar los principales focos rojos de la operación. Como resultado del proyecto, se diseñó e implementó un modelo automatizado de Alerta Temprana (Early Warning) en SQL que aísla de forma proactiva a los 500 clientes activos con mayor probabilidad de abandono según sus patrones de consumo. Gracias a esto, el negocio ahora cuenta con un activo analítico clave para transicionar de una postura reactiva a una estrategia proactiva, agilizando la toma de decisiones comerciales y permitiendo al equipo de Marketing y Customer Success desplegar campañas de lealtad hiper-dirigidas para blindar los ingresos de la compañía."
  descripcion_en: "This project consisted of the strategic analysis and optimization of the customer retention ecosystem for a growing telecommunications company. The main objective was to centralize and structure massive information from its subscriber database (detailing demographic profiles, tenure, contract types, and payment methods) along with the breakdown of consumption across its suite of advanced services (DSL and fiber optic connectivity, cybersecurity tools, technical support, and streaming platforms). With this raw database, a rigorous cleaning and transformation process was implemented in PostgreSQL, converting inconsistent records into a unified analytical environment that balances a high-level financial diagnosis with an analysis of users' operational behavior. The solution allows the business to continuously monitor its commercial health by tracking critical retention KPIs such as the global Churn rate, the impact on lost monthly revenue, accumulated Customer Lifetime Value, and service adoption density per user. To respond to the strategic needs of the company, the analysis was structured to identify the main red flags in the operation. As a result of the project, an automated Early Warning model was designed and implemented in SQL to proactively isolate the top 500 active customers with the highest probability of leaving based on their consumption patterns. Thanks to this, the business now has a key analytical asset to transition from a reactive stance to a proactive strategy, streamlining commercial decision-making and allowing the Marketing and Customer Success teams to deploy hyper-targeted loyalty campaigns to safeguard the company's revenue."
  herramientas: "SQL / PostgreSQL"
